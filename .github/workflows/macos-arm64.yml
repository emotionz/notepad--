name: macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package macOS arm64
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
        working-directory: gitee-source
    steps:
      - uses: actions/checkout@v5
      - name: Fetch latest public source from Gitee
        working-directory: .
        run: |
          git clone --depth 1 --single-branch --branch master https://gitee.com/cxasm/notepad--.git gitee-source
          python3 - <<'PY'
          import json, pathlib, subprocess
          commit = subprocess.check_output(['git', '-C', 'gitee-source', 'rev-parse', 'HEAD'], text=True).strip()
          info = {'repository': 'git@gitee.com:cxasm/notepad--.git', 'branch': 'master', 'commit': commit}
          pathlib.Path('gitee-source/UPSTREAM_SOURCE.json').write_text(json.dumps(info, indent=2) + chr(10))
          PY
      - name: Record actual source version and commit
        id: info
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          header = pathlib.Path('src/rcglobal.h').read_text(encoding='utf-8-sig')
          version = re.search(r'VersionStr\s*=\s*"v(\d+\.\d+\.\d+)"', header).group(1)
          provenance = pathlib.Path('UPSTREAM_SOURCE.json')
          info = json.loads(provenance.read_text()) if provenance.exists() else {'repository': 'https://github.com/emotionz/notepad--'}
          info.update(version=version, workflow_commit=os.environ['GITHUB_SHA'], build_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), architecture='arm64')
          pathlib.Path('dist').mkdir(exist_ok=True)
          pathlib.Path('dist/BUILD_INFO.json').write_text(json.dumps(info, indent=2) + chr(10))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('NDD_VERSION=' + version + chr(10))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Source build version: **' + version + '**' + chr(10) + chr(10) + json.dumps(info, indent=2) + chr(10))
          PY
      - name: Install Qt on the cloud runner
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ndd-build
          create-args: >-
            -c conda-forge
            qt-main=5.15.15
            cmake<4
            ninja
          cache-environment: true
      - name: Configure native Mac application
        run: |
          test "$(uname -m)" = arm64
          mkdir -p .ci-macos
          cat > .ci-macos/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(Notepad-- VERSION ${NDD_VERSION} LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 14)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_AUTOMOC ON)
          set(CMAKE_AUTOUIC ON)
          set(CMAKE_AUTORCC ON)
          set(ROOT "${CMAKE_CURRENT_LIST_DIR}/..")
          set(CMAKE_AUTOUIC_SEARCH_PATHS "${ROOT}/src" "${ROOT}/src/cceditor")
          find_package(Qt5 REQUIRED COMPONENTS Core Gui Widgets Concurrent Network PrintSupport XmlPatterns MacExtras)
          add_subdirectory("${ROOT}/src/qscint" qscint)
          target_link_libraries(qscint Qt5::MacExtras)
          file(GLOB SRC "${ROOT}/src/*.cpp" "${ROOT}/src/cceditor/*.cpp")
          file(GLOB UI "${ROOT}/src/*.ui" "${ROOT}/src/cceditor/*.ui")
          add_executable(Notepad-- MACOSX_BUNDLE ${SRC} ${UI} "${ROOT}/src/RealCompare.qrc" "${ROOT}/src/mac.icns")
          set_source_files_properties("${ROOT}/src/mac.icns" PROPERTIES MACOSX_PACKAGE_LOCATION Resources)
          target_include_directories(Notepad-- PRIVATE "${ROOT}/src" "${ROOT}/src/cceditor" "${ROOT}/src/include" "${ROOT}/src/qscint/scintilla/lexlib" "${ROOT}/src/qscint/scintilla/boostregex")
          target_link_libraries(Notepad-- PRIVATE qscint Qt5::Core Qt5::Gui Qt5::Widgets Qt5::Concurrent Qt5::Network Qt5::PrintSupport Qt5::XmlPatterns Qt5::MacExtras)
          set_target_properties(Notepad-- PROPERTIES MACOSX_BUNDLE_GUI_IDENTIFIER org.emotionz.notepad MACOSX_BUNDLE_BUNDLE_NAME "Notepad--" MACOSX_BUNDLE_ICON_FILE mac.icns MACOSX_BUNDLE_SHORT_VERSION_STRING "${PROJECT_VERSION}")
          CMAKE
          cmake -S .ci-macos -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNDD_VERSION="$NDD_VERSION" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compile
        run: cmake --build build --parallel 3
      - name: Bundle runtime libraries and package
        run: |
          mkdir -p dist build/Notepad--.app/Contents/Resources/licenses
          cp LICENSE build/Notepad--.app/Contents/Resources/licenses/
          cp how_build/THIRDPARTY.md build/Notepad--.app/Contents/Resources/licenses/
          cp src/realcompare_zh.qm build/Notepad--.app/Contents/MacOS/
          cp -R src/themes build/Notepad--.app/Contents/MacOS/themes
          macdeployqt build/Notepad--.app -always-overwrite -verbose=2
          codesign --force --deep --sign - build/Notepad--.app
          codesign --verify --deep --strict build/Notepad--.app
          file build/Notepad--.app/Contents/MacOS/Notepad--
          lipo build/Notepad--.app/Contents/MacOS/Notepad-- -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent build/Notepad--.app dist/Notepad--macOS-arm64.zip
          hdiutil create -volname Notepad-- -srcfolder build/Notepad--.app -ov -format UDZO dist/Notepad--macOS-arm64.dmg
          git archive --format=tar.gz --output=dist/notepad-source.tar.gz HEAD
          cp "$GITHUB_WORKSPACE/.github/workflows/macos-arm64.yml" dist/cloud-build.yml
          shasum -a 256 dist/*.zip dist/*.dmg > dist/SHA256SUMS.txt
      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: Notepad--Gitee-macOS-arm64
          path: gitee-source/dist/
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Test downloaded app on a fresh Mac
    needs: build
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Notepad--Gitee-macOS-arm64
          path: package
      - name: Extract and check standalone application
        shell: bash
        run: |
          ditto -x -k package/Notepad--macOS-arm64.zip standalone
          codesign --verify --deep --strict standalone/Notepad--.app
          lipo standalone/Notepad--.app/Contents/MacOS/Notepad-- -verify_arch arm64
          python3 - <<'PY'
          import json, os, pathlib, plistlib, subprocess, tempfile, time
          app = pathlib.Path('standalone/Notepad--.app').resolve()
          info = json.loads(pathlib.Path('package/BUILD_INFO.json').read_text())
          with (app / 'Contents/Info.plist').open('rb') as stream:
              assert plistlib.load(stream)['CFBundleShortVersionString'] == info['version']
          for path in app.rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              with path.open('rb') as stream:
                  magic = stream.read(4).hex()
              if magic not in ('cffaedfe', 'feedfacf', 'cafebabe', 'bebafeca'):
                  continue
              output = subprocess.check_output(['/usr/bin/otool', '-L', str(path)], text=True)
              for line in output.splitlines()[1:]:
                  dep = line.strip().split(' (', 1)[0]
                  if dep.startswith('/') and not dep.startswith(('/usr/lib/', '/System/Library/')):
                      raise RuntimeError('External build-machine library: ' + dep)
          assert (app / 'Contents/PlugIns/platforms/libqcocoa.dylib').is_file()
          assert (app / 'Contents/MacOS/themes').is_dir()
          exe = app / 'Contents/MacOS/Notepad--'
          with tempfile.TemporaryDirectory() as home:
              env = {'HOME': home, 'PATH': '/usr/bin:/bin:/usr/sbin:/sbin', 'TMPDIR': home, 'DYLD_PRINT_LIBRARIES': '1'}
              with open('launch.log', 'w') as log:
                  process = subprocess.Popen([str(exe)], cwd=home, env=env, stdout=log, stderr=log)
                  try:
                      time.sleep(12)
                      if process.poll() is not None:
                          raise RuntimeError('Application exited early: ' + str(process.returncode))
                  finally:
                      if process.poll() is None:
                          process.terminate()
                          process.wait(timeout=10)
          print(pathlib.Path('launch.log').read_text())
          print('PASS: packaged arm64 application runs without the build environment')
          PY
      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-launch-check
          path: launch.log
          if-no-files-found: ignore
